apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: noteconfigs.shift-week.example.com
spec:
  group: shift-week.example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - maxNotes
                - retentionDays
              properties:
                maxNotes:
                  type: integer
                  minimum: 1
                retentionDays:
                  type: integer
                  minimum: 0
  scope: Namespaced
  names:
    plural: noteconfigs
    singular: noteconfig
    kind: NoteConfig
    shortNames:
      - nc
