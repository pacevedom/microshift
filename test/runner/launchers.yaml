launchers:
  # Standard launcher for RHEL 9.6 with kickstart template
  - name: el96-src@standard
    description: |
      Standard launcher for RHEL 9.6 VMs using kickstart template.
    config:
      cpu: 2
      memory: 4096
      network:
        - "default"
      kickstart: kickstart.ks.template
      base: rhel-9.6-microshift-source
      os: el96
      blueprint: rhel-9.6
