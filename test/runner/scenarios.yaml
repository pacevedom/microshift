scenarios:
  # Example: Standard test suite (non-upgrade)
  - name: el96-src@dns
    description: |
      Run DNS test suite against any MicroShift instance.
    suites:
      - suites/standard1/dns.robot
    config:
      network:
        - "default"
      os: "el96"
    variables:
      USHIFT_HOST: "host1"
      USHIFT_USER: "root"
    destroy_vm: false
