scenarios:
  # Example: Standard test suite (non-upgrade)
  - name: el96-src@standard-suite1
    description: |
      Run standard test suite against MicroShift built from source
      on RHEL 9.6. This test does not require VM destruction.
    suites:
      - suites/standard1
    config:
      network:
        - "default"
    variables:
      USHIFT_HOST: "host1"
      USHIFT_USER: "root"
    destroy_vm: false
